[tool.poetry]
name = "corporate-pipeline"
version = "0.1.0"
description = "Corporate credit rating pipeline"
authors = ["Bechir"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110"
uvicorn = { extras = ["standard"], version = "^0.29" }
pandas = "^2.2"
openpyxl = "^3.1"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0"
isort = "^5.13"
ruff = "^0.4"
httpx = "^0.28.1"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
